name: weight-care-aliyun

services:
  api:
    image: weight-care-api:${RELEASE_TAG:?RELEASE_TAG must be set in .env}
    build: ./apps/api
    restart: unless-stopped
    init: true
    env_file: [.env]
    environment:
      NODE_ENV: production
    expose: ["3000"]
    volumes: ["media_data:/app/uploads"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/clinician-admin/dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
volumes:
  media_data: {}
