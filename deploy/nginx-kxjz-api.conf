server {
    listen 80;
    server_name kxjzapi.hzmwmt.cn;
    root /www/wwwroot/kxjzapi.hzmwmt.cn;

    #CERT-APPLY-CHECK--START
    # Used by BaoTa for ACME HTTP-01 validation. Keep directly below root.
    include /www/server/panel/vhost/nginx/well-known/kxjzapi.hzmwmt.cn.conf;
    #CERT-APPLY-CHECK--END

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name kxjzapi.hzmwmt.cn;
    server_tokens off;
    client_max_body_size 10m;

    ssl_certificate /www/server/panel/vhost/letsencrypt/kxjzapi.hzmwmt.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/letsencrypt/kxjzapi.hzmwmt.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KXJZSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
