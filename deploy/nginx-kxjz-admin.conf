server {
    listen 80;
    server_name kxjz.hzmwmt.cn;
    root /www/wwwroot/kxjz.hzmwmt.cn;

    #CERT-APPLY-CHECK--START
    # Used by BaoTa for ACME HTTP-01 validation. Keep directly below root.
    include /www/server/panel/vhost/nginx/well-known/kxjz.hzmwmt.cn.conf;
    #CERT-APPLY-CHECK--END

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name kxjz.hzmwmt.cn;

    ssl_certificate /www/server/panel/vhost/letsencrypt/kxjz.hzmwmt.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/letsencrypt/kxjz.hzmwmt.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KXJZSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/kxjz-weight-care/apps/clinician-admin/dist;
    index index.html;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://kxjzapi.hzmwmt.cn" always;

    location = /index.html {
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://kxjzapi.hzmwmt.cn" always;
    }

    location = /h5 {
        return 301 /h5/;
    }

    location = /h5/ {
        root /opt/kxjz-weight-care/apps/mini-program/dist/build;
        try_files /h5/index.html =404;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'sha256-1oAL6NYNgaclFPRJ8+ogOa5BMYXACi+iZ8AuNEV6D2M='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://kxjzapi.hzmwmt.cn" always;
    }

    location = /h5/index.html {
        root /opt/kxjz-weight-care/apps/mini-program/dist/build;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'sha256-1oAL6NYNgaclFPRJ8+ogOa5BMYXACi+iZ8AuNEV6D2M='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://kxjzapi.hzmwmt.cn" always;
    }

    location ~* ^/h5/.*\.(?:js|css|png|jpg|jpeg|webp|svg|woff2?)$ {
        root /opt/kxjz-weight-care/apps/mini-program/dist/build;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location /h5/ {
        root /opt/kxjz-weight-care/apps/mini-program/dist/build;
        try_files $uri $uri/ /h5/index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
