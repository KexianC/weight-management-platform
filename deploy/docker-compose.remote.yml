name: kxjz-weight-care

services:
  api:
    image: kxjz-weight-care-api:${RELEASE_TAG:?RELEASE_TAG must be set via --env-file .env}
    build:
      context: ../apps/api
    restart: unless-stopped
    init: true
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - media_data:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  media_data: {}
