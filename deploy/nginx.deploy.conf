# The published port is loopback-only. The host TLS proxy supplies this header.
map $http_x_forwarded_proto $weight_care_forwarded_proto {
  default $scheme;
  https https;
  http http;
}

map $http_x_forwarded_for $weight_care_forwarded_for {
  default $http_x_forwarded_for;
  "" $remote_addr;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Allow a 20 MiB business upload plus multipart envelope.
  client_max_body_size 24m;
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $weight_care_forwarded_for;
    proxy_set_header X-Forwarded-Proto $weight_care_forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }

  location ~ /\. { deny all; }
  location = /h5 { return 301 /h5/; }
  location = /index.html { expires -1; }
  location = /h5/index.html { expires -1; }
  location ~* \.(?:js|css|png|jpg|jpeg|webp|svg|woff2?)$ {
    expires 7d;
    try_files $uri =404;
  }
  location /h5/ {
    try_files $uri $uri/ /h5/index.html;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
